steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/apex-dashboard:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/apex-dashboard:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'apex-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/apex-dashboard:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'POLYGON_API_KEY=${_POLYGON_API_KEY},COINGECKO_API_KEY=${_COINGECKO_API_KEY}'
options:
  substitutionOption: 'ALLOW_LOOSE'
substitutions:
  _POLYGON_API_KEY: ''  # Set in Cloud Build trigger
  _COINGECKO_API_KEY: ''  # Set in Cloud Build trigger