name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for badge commit step
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Allows the badge commit step to push back to the branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # ── Badge update (main branch only) ────────────────────────────────────

      - name: Update coverage badge in README
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          PCT_INT=$(printf "%.0f" "$PCT")
          if [ "$PCT_INT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$PCT_INT" -ge 60 ]; then COLOR=yellow
          else COLOR=red
          fi
          BADGE="![Go Coverage](https://img.shields.io/badge/Go%20Coverage-${PCT_INT}%25-${COLOR})"
          sed -i "s|!\[Go Coverage\](https://img.shields.io/badge/Go.*)|${BADGE}|" ../README.md

      - name: Commit updated badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../README.md
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # ── Badge update (main branch only) ────────────────────────────────────

      - name: Update frontend coverage badge in README
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PCT=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(Math.round(s.total.lines.pct))")
          if [ "$PCT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 60 ]; then COLOR=yellow
          else COLOR=red
          fi
          BADGE="![Frontend Coverage](https://img.shields.io/badge/Frontend%20Coverage-${PCT}%25-${COLOR})"
          sed -i "s|!\[Frontend Coverage\](https://img.shields.io/badge/Frontend.*)|${BADGE}|" ../README.md

      - name: Commit updated badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../README.md
          git diff --staged --quiet || git commit -m "chore: update frontend coverage badge [skip ci]"
          git push
